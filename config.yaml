# ============================================================================
# Примеры конфигураций
# ============================================================================

# --- config-basic.yaml ---
# Минимальная конфигурация для двух портов
socket_path: /tmp/traffic_gen.sock
pci_devices:
  - "0000:01:00.0"
  - "0000:01:00.1"

socket_path: /tmp/traffic_gen.sock
pci_devices:
- "--vdev=net_tap1,iface=dpdk-1"
- "--vdev=net_tap2,iface=dpdk-2"

# # --- config-4ports.yaml ---
# # Конфигурация с 4 портами
# socket_path: /tmp/traffic_gen.sock
